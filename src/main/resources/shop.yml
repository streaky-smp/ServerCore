# =============================================================================
#  ServerCore - server shop catalogue
# =============================================================================
#  Prices are written in whole currency (what a player sees) and converted to
#  integer minor units on load, so "4.50" is exact and never drifts.
#
#  RULES ENFORCED AT LOAD -- the server refuses to start if you break them:
#    * sell-price may never exceed buy-price. Otherwise players buy an item and
#      immediately resell it for profit, creating unlimited money.
#    * Each material may appear in only one category. Sell lookups are by
#      material, so a duplicate would make "what is this worth" ambiguous.
#    * Every item needs at least one of buy-price or sell-price.
#
#  Omit buy-price to make an item sell-only; omit sell-price to make it
#  buy-only. Tools, weapons and armour are buy-only by default: if they could be
#  sold, cheap crafting would turn raw materials into a money loop.
#
#  Only undamaged, unenchanted, unrenamed items can be sold. An enchanted
#  diamond pickaxe is not the item this list prices.
#
#  THESE PRICES ARE DEFAULTS, NOT BALANCED VALUES. The sell/buy ratio here is
#  roughly 1:3, which makes the shop a net money sink. Calibrate against your
#  own server's income rates -- see docs/ECONOMY.md.
# =============================================================================

