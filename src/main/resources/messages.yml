# =============================================================================
#  ServerCore - player-facing text
# =============================================================================
#  MiniMessage markup: https://docs.advntr.dev/minimessage/format.html
#  Placeholders appear as <name> and are supplied by the plugin.
#
#  Adding or removing keys is safe; a key the plugin looks for but cannot find
#  renders as a visible [missing message: key] marker rather than a blank line.
# =============================================================================

prefix: "<dark_gray>[<aqua>Server</aqua>]</dark_gray> "

error:
  no-permission: "<red>You do not have permission to do that.</red> <dark_gray>(<permission>)</dark_gray>"
  player-only: "<red>That command can only be used by a player.</red>"
  unknown-player: "<red>No player named <white><name></white> has been seen on this server.</red>"
  invalid-amount: "<red><white><input></white> is not a valid amount.</red>"
  internal: "<red>Something went wrong. The error has been logged and nothing was changed.</red>"

notifications:
  while-away: "<gray>You have <white><count></white> message(s) from while you were away:</gray>"

admin:
  reload-success: "<green>Configuration reloaded.</green>"
  reload-failed: "<red>Reload failed: <white><reason></white></red> <gray>Previous settings are still active.</gray>"
  status-header: "<gray><strikethrough>                    </strikethrough></gray> <aqua>ServerCore</aqua> <gray><strikethrough>                    </strikethrough></gray>"

economy:
