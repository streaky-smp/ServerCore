    above-maximum: "<red>The largest payment is</red> <white><maximum></white><red>.</red>"
    cooldown: "<red>You must wait</red> <white><remaining></white> <red>before paying again.</red>"
    self-payment: "<red>You cannot pay yourself.</red>"
