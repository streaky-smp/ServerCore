name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["Feature"]
assignees:
  - Speedymr01
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the information below.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear description of the feature you'd like.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why do you need this feature? What problem does it solve?
      placeholder: Describe your use case...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: If you have ideas on how this could work, describe them here.
      placeholder: Optional implementation ideas...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
      placeholder: Optional alternatives...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful.
      placeholder: Optional details...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you? (The triage bot will verify this independently)
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Critical for my use case
        - Urgent - Blocking production/event
    validations:
      required: false

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      description: How complex do you think this feature would be? (The triage bot will verify this independently)
      options:
        - Low - Simple addition
        - Medium - Moderate changes needed
        - High - Significant work required
    validations:
      required: false
