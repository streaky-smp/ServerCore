name: Version Update
description: Update this plugin
title: "Update to [version]"
labels: ["Version Update"]
assignees:
  - Speedymr01
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Please update this plugin to the specified version.

  - type: input
    id: version
    attributes:
      label: Version to update to
      description: Enter the minecraft version you want this plugin updated to.
      placeholder: ex. 26.1.2
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for Update
      description: Why do you need this update? This helps us prioritize.
      placeholder: |
        e.g., "Running a paper 1.21.4 server for my survival community" or "Need this for my competitive minigame network"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add any extra information or context for this update request.
      placeholder: Optional details…
    validations:
      required: false
