name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bump version to match tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''

          # Update only the project version in pom.xml (first <version> under <project>)
          [xml]$pom = Get-Content -Path "pom.xml"
          $pom.project.version = $version
          $pom.Save("pom.xml")

          Write-Host "Bumped version to $version"

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bump version to $version"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build and test
        run: pwsh ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin
          path: target/*.jar

  github-release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin
          path: plugin

      - name: Find JAR file
        id: findjar
        shell: bash
        run: |
          cd plugin
          echo "jar=$(ls *.jar | head -1)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body || '' }}
          prerelease: ${{ github.event.release.prerelease || false }}
          generate_release_notes: false
          files: |
            plugin/${{ steps.findjar.outputs.jar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
