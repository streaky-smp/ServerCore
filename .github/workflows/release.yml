name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build and test
        run: pwsh ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin
          path: target/*.jar

  github-release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin
          path: plugin

      - name: Find JAR file
        id: findjar
        shell: bash
        run: |
          cd plugin
          echo "jar=$(ls *.jar | head -1)" >> $GITHUB_OUTPUT

      - name: Fetch existing release info
        id: oldrelease
        run: |
          release=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json name,body,prerelease 2>/dev/null || true)
          if [ -n "$release" ]; then
            echo "name=$(echo "$release" | jq -r '.name')" >> $GITHUB_OUTPUT
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$release" | jq -r '.body' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "prerelease=$(echo "$release" | jq -r '.prerelease')" >> $GITHUB_OUTPUT
          else
            echo "name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "body=" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing release (if any)
        run: |
          gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.oldrelease.outputs.name }}
          body: ${{ steps.oldrelease.outputs.body }}
          prerelease: ${{ steps.oldrelease.outputs.prerelease == 'true' }}
          files: |
            plugin/${{ steps.findjar.outputs.jar }}
